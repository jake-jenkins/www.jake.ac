apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: jakeac
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  secretRef:
    name: jakeac-git
  url: ssh://git@github.com/jake-jenkins/www.jake.ac
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jakeac
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: jakeac
  path: ./kubernetes

