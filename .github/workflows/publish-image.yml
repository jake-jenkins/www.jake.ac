name: Build and publish container image

on:
  push:
    branches:
      - main
    # Flux commits only the selected image tag. Ignoring GitOps-only changes
    # prevents that commit from building another image in an endless loop.
    paths-ignore:
      - kubernetes/**
      - clusters/**
      - DEPLOYMENT.md
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run deployment tests
        run: python3 -m unittest discover -s tests -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main-${{ github.run_number }}
            type=sha,format=long
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test exact image with production runtime restrictions
        env:
          IMAGE: ghcr.io/jake-jenkins/www.jake.ac@${{ steps.build.outputs.digest }}
        run: bash deploy/smoke-image.sh

  scan-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR for scanning
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan immutable image for fixable high and critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/jake-jenkins/www.jake.ac@${{ needs.build-and-push.outputs.digest }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: vulnerability-report.json
      - name: Retain vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-vulnerability-report
          path: vulnerability-report.json
          retention-days: 30

  promote-london:
    if: github.ref == 'refs/heads/main'
    needs: [build-and-push, scan-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR for promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up the Flux CLI
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4
        with:
          version: '2.9.4'
      - name: Promote the scanned image for Flux
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release="0.0.0-london.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          artifact="$(mktemp -d)"
          manifest="$artifact/release.yaml"
          trap 'rm -rf "$artifact"' EXIT
          jq -n --arg digest "$IMAGE_DIGEST" '{
            apiVersion: "v1",
            kind: "ConfigMap",
            metadata: {
              name: "london-release-jakeac",
              namespace: "flux-system",
              labels: {"reconcile.fluxcd.io/watch": "Enabled"}
            },
            data: {"LONDON_JAKE_DIGEST": $digest}
          }' > "$manifest"
          flux push artifact "oci://$image:$release" -f "$artifact" \
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision "$GITHUB_REF_NAME@sha1:$GITHUB_SHA"
