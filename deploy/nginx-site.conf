server {
    listen 127.0.0.1:18444;
    server_name www.jake.ac;
    keepalive_timeout 5s;
    include /etc/nginx/jake-routes.conf;
}
server {
    listen 80;
    listen [::]:80;
    server_name jake.ac www.jake.ac;
    return 308 https://www.jake.ac$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jake.ac;
    ssl_certificate /etc/letsencrypt/live/jake.ac/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jake.ac/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.jake.ac$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jake.ac;
    ssl_certificate /etc/letsencrypt/live/jake.ac/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jake.ac/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    keepalive_timeout 5s;
    include /etc/nginx/jake-routes.conf;
}
